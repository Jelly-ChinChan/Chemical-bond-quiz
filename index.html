<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#153950" />
  <title>化學鍵與物質結構｜15 題診斷測驗</title>
  <style>
    :root{--navy:#153950;--teal:#087e78;--pale:#eaf7f5;--ink:#203c49;--muted:#637984;--bg:#f1f5f7;--edge:#dbe5e9;--red:#b44545}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
    header{padding:31px 16px 53px;text-align:center;background:linear-gradient(115deg,#153950,#0d7777);color:white}header h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}header p{margin:0;color:#d5efed}
    main{max-width:1060px;margin:-28px auto 48px;padding:0 14px}.panel{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:22px;box-shadow:0 6px 25px #1539500e;margin-bottom:15px}
    .student{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}label.field{display:flex;flex-direction:column;font-weight:650;font-size:14px;gap:4px}input[type=text]{font:inherit;border:1px solid #bdcdd4;padding:11px;border-radius:9px;width:100%}
    .layout{display:grid;grid-template-columns:217px 1fr;align-items:start;gap:15px}.aside{position:sticky;top:10px}.small{font-size:13px;color:var(--muted)}.progress{height:9px;background:#e4eff0;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--teal);width:0%}
    .numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.number{border:1px solid var(--edge);background:white;border-radius:9px;min-height:37px;cursor:pointer}.number.done{background:#dbf5eb;border-color:#79b7ad}.number.current{background:var(--navy);color:white}
    .pill{display:inline-block;padding:3px 10px;background:var(--pale);border-radius:30px;color:#12756d;font-size:12px;margin:3px 5px 3px 0}h2{font-size:23px;line-height:1.4;margin:12px 0}.stem{white-space:pre-wrap;font-size:17px;margin:13px 0 22px}
    .option{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--edge);border-radius:11px;padding:13px;margin:9px 0;cursor:pointer}.option.checked{border-color:var(--teal);background:#f0faf7}.option input{margin-top:7px;accent-color:var(--teal)}.option span{flex:1}
    .actions{border-top:1px solid var(--edge);padding-top:18px;margin-top:21px;display:flex;gap:9px;flex-wrap:wrap}.btn{background:white;border:1px solid var(--edge);border-radius:10px;font:inherit;font-weight:650;padding:10px 14px;cursor:pointer;min-height:44px}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn:disabled{opacity:.5;cursor:not-allowed}
    .notice{padding:12px 14px;border-radius:10px;background:#e6f3f0;margin-bottom:15px}.notice.warning{background:#fff1d9;color:#7a4c0e}.notice.error{background:#fff0ef;color:#a53b3b}.hidden{display:none!important}
    .score{font-weight:780;font-size:39px;color:var(--teal);line-height:1.3}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.metric{background:#f2f6f7;border-radius:10px;padding:12px;text-align:center}.metric strong{display:block;font-size:23px}
    .skill{margin:16px 0}.skill-track{height:11px;border-radius:30px;background:#e4eaea;overflow:hidden}.skill-track div{height:100%;background:var(--teal)}.review{border:1px solid var(--edge);border-radius:12px;padding:16px;margin:13px 0}.review h3{margin:0 0 7px}.review .explain{background:#f1f8f7;border-left:3px solid var(--teal);padding:9px 12px;margin:11px 0}.wrong{color:var(--red)}.correct{color:#0b7563}.review details{margin-top:8px}.review summary{cursor:pointer;color:#155d64}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.aside{position:static}.numbers{grid-template-columns:repeat(8,minmax(0,1fr))}}
    @media(max-width:600px){.student{grid-template-columns:1fr}.panel{padding:16px}h2{font-size:21px}}
    @media print{header,.aside,.student,.actions,footer{display:none!important}main{margin:0}.panel{box-shadow:none}.review{break-inside:avoid}}

  /* 進站身分選擇 */
  .role-panel{max-width:760px;margin:15px auto;text-align:center}
  .role-panel h2{font-size:27px}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .role-choice{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid #d4e4e6;background:#f9fcfd;padding:30px 15px;border-radius:15px;cursor:pointer;color:#153950;font:inherit}
  .role-choice:hover,.role-choice:focus-visible{border-color:var(--teal);background:#ebf8f5}
  .role-choice strong{font-size:22px}.role-choice small{color:var(--muted)}.role-icon{font-size:38px}
  .mode-bar{display:flex;align-items:center;gap:14px;margin-bottom:13px;background:white;border:1px solid var(--edge);border-radius:12px;padding:9px 12px}.mode-bar span{color:var(--muted);font-weight:650}
  #teacherLoginPanel{max-width:550px;margin:0 auto}
  #teacherLoginPanel input{font:inherit;border:1px solid #bdcdd4;border-radius:9px;padding:12px;width:100%;margin-top:7px}
  #teacherLoginPanel .notice{margin-top:15px}
  /* 教師後台限定樣式：不干擾學生試題 */
  #teacherApp .teacher-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  #teacherApp .teacher-heading h2{margin:5px 0}
  #teacherApp .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  #teacherApp .card{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:13px}
  #teacherApp .card small{color:var(--muted)}#teacherApp .card strong{display:block;font-size:25px;margin-top:3px}
  #teacherApp .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:white;padding:13px;border:1px solid var(--edge);border-radius:12px;margin-bottom:14px}
  #teacherApp label{display:flex;flex-direction:column;gap:4px;color:#526975;font-size:13px}
  #teacherApp input,#teacherApp select{background:white;border:1px solid #c7d5da;padding:8px 10px;border-radius:8px;min-width:130px;font:inherit}
  #teacherApp button{background:var(--teal);color:white;border:0;border-radius:9px;padding:10px 12px;cursor:pointer;font:inherit}
  #teacherApp button.secondary{background:#e7f0f1;color:#164d55}
  #teacherApp button:disabled{opacity:.6;cursor:not-allowed}
  #teacherApp .nav{display:flex;gap:7px;margin:10px 0 15px;flex-wrap:wrap}
  #teacherApp .nav button{background:white;color:var(--ink);border:1px solid var(--edge)}
  #teacherApp .nav button.active{background:var(--teal);color:white}
  #teacherApp section{background:white;border:1px solid var(--edge);border-radius:12px;padding:15px;margin-bottom:15px}
  #teacherApp h2{font-size:20px;margin:0 0 11px}
  #teacherApp table{width:100%;border-collapse:collapse;font-size:13px}
  #teacherApp th,#teacherApp td{text-align:left;border-bottom:1px solid #e6eded;padding:9px 7px;vertical-align:top}
  #teacherApp th{background:#f2f7f7;color:#4c6771;position:sticky;top:0}
  #teacherApp .scroller{max-height:475px;overflow:auto}
  #teacherApp .muted{color:var(--muted)}#teacherApp .small{font-size:12px}
  #teacherApp .detail{margin:10px 0;padding:13px;border:1px solid var(--edge);border-radius:9px;background:#fbfcfd}
  #teacherApp .detail summary{font-weight:650;cursor:pointer}
  #teacherApp .detail p{margin:7px 0;white-space:pre-wrap}
  #teacherApp .pill{display:inline-block;background:#fce6e3;color:#a84141;border-radius:20px;padding:1px 8px}
  #teacherApp .highlight{color:#08776b;font-weight:750}
  #teacherApp .bar{height:9px;background:#e5eff0;border-radius:15px;width:110px;overflow:hidden}
  #teacherApp .bar>div{height:100%;background:#cc6b5d}
  @media(max-width:850px){#teacherApp .cards{grid-template-columns:repeat(2,1fr)}#teacherApp .filters{display:grid;grid-template-columns:repeat(2,1fr)}#teacherApp input,#teacherApp select{min-width:0}}
  @media(max-width:580px){.role-grid{grid-template-columns:1fr}#teacherApp .filters{grid-template-columns:1fr}#teacherApp .teacher-heading{align-items:flex-start;flex-direction:column}}
  @media print{.mode-bar,.role-panel,#teacherLoginPanel,#teacherApp .teacher-heading{display:none!important}}
  </style>
</head>
<body>
<header><h1>化學鍵與物質結構</h1><p>學測化學補強｜15 題診斷｜每題 2 分｜滿分 30 分</p></header>
<main>
  <section id="rolePanel" class="panel role-panel">
    <h2>請選擇您的身分</h2>
    <p class="small">學生可以直接開始作答；教師須先輸入密碼才能查看全班成績和錯題。</p>
    <div class="role-grid">
      <button id="roleStudent" type="button" class="role-choice"><span class="role-icon">🎓</span><strong>我是學生</strong><small>開始 15 題化學診斷測驗</small></button>
      <button id="roleTeacher" type="button" class="role-choice"><span class="role-icon">📊</span><strong>我是教師</strong><small>密碼登入、查看錯題分析</small></button>
    </div>
  </section>
  <div id="modeBar" class="mode-bar hidden"><button class="btn" id="backToRoles" type="button">← 返回身分選擇</button><span id="modeLabel"></span></div>
  <section id="teacherLoginPanel" class="panel hidden">
    <h2>教師身分驗證</h2>
    <p class="small">教師密碼僅送至 Apps Script 驗證，不儲存在 GitHub 原始碼內。</p>
    <label class="field">教師密碼<input id="teacherPassword" type="password" placeholder="請輸入教師密碼" autocomplete="current-password" maxlength="128" /></label>
    <div class="actions"><button class="btn primary" id="teacherLoginBtn" type="button">登入教師後台</button></div>
    <p id="loginMessage" class="notice warning hidden" role="status"></p>
  </section>
  <div id="studentApp" class="hidden">
  <section class="panel student" id="identityPanel">
    <label class="field">班級<input id="className" type="text" maxlength="20" placeholder="例如 301" autocomplete="off" /></label>
    <label class="field">座號<input id="seat" type="text" maxlength="8" placeholder="例如 08" autocomplete="off" /></label>
    <label class="field">學生姓名<input id="studentName" type="text" maxlength="40" placeholder="請填寫姓名" autocomplete="off" /></label>
  </section>
  <div id="notice" class="notice">題目已嵌入網頁，無需連線即可開始作答。</div>
  <div class="layout">
    <aside
