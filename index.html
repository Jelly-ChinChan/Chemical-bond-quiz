
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>化學鍵與物質結構｜診斷測驗</title>

<style>
:root {
  --navy:#153950;
  --teal:#087e78;
  --ink:#203c49;
  --muted:#637984;
  --bg:#f1f5f7;
  --edge:#dbe5e9;
  --red:#b44545;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:system-ui,"Noto Sans TC",
    "Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
}
header {
  padding:31px 16px 53px;
  text-align:center;
  background:linear-gradient(115deg,#153950,#0d7777);
  color:white;
}
header h1 {
  font-size:clamp(24px,4vw,34px);
  margin:0 0 6px;
}
header p {margin:0;color:#d5efed}
main {
  max-width:1060px;
  margin:-28px auto 48px;
  padding:0 14px;
}
.panel {
  background:white;
  border:1px solid var(--edge);
  border-radius:16px;
  padding:22px;
  margin-bottom:15px;
  box-shadow:0 6px 25px #1539500e;
}
.hidden {display:none!important}
.small {font-size:13px;color:var(--muted)}
.btn {
  background:white;
  border:1px solid var(--edge);
  border-radius:10px;
  font:inherit;
  font-weight:650;
  padding:10px 14px;
  cursor:pointer;
  min-height:44px;
}
.btn.primary {
  background:var(--teal);
  border-color:var(--teal);
  color:white;
}
button:disabled {opacity:.5;cursor:not-allowed}
.actions {
  border-top:1px solid var(--edge);
  padding-top:18px;
  margin-top:21px;
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
.notice {
  padding:12px 14px;
  border-radius:10px;
  background:#e6f3f0;
  margin-bottom:15px;
}
.notice.warning {
  background:#fff1d9;
  color:#7a4c0e;
}
.notice.error {
  background:#fff0ef;
  color:#a53b3b;
}

/* 身分選擇 */
.role-panel {
  max-width:760px;
  margin:15px auto;
  text-align:center;
}
.role-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:22px;
}
.role-choice {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  border:2px solid #d4e4e6;
  background:#f9fcfd;
  padding:30px 15px;
  border-radius:15px;
  cursor:pointer;
  color:var(--navy);
  font:inherit;
}
.role-choice strong {font-size:22px}
.role-choice small {color:var(--muted)}
.role-icon {font-size:38px}
.role-choice:hover {
  border-color:var(--teal);
  background:#ebf8f5;
}
.mode-bar {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:13px;
  background:white;
  padding:9px 12px;
  border:1px solid var(--edge);
  border-radius:12px;
}
#teacherLoginPanel {
  max-width:550px;
  margin:0 auto;
}
input[type=text],
input[type=password] {
  font:inherit;
  border:1px solid #bdcdd4;
  padding:11px;
  border-radius:9px;
  width:100%;
}
label.field {
  display:flex;
  flex-direction:column;
  font-weight:650;
  font-size:14px;
  gap:4px;
}
.student {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

/* 學生題目 */
.layout {
  display:grid;
  grid-template-columns:217px 1fr;
  align-items:start;
  gap:15px;
}
.aside {position:sticky;top:10px}
.progress {
  height:9px;
  background:#e4eff0;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.progress div {
  height:100%;
  background:var(--teal);
  width:0%;
}
.numbers {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.number {
  border:1px solid var(--edge);
  background:white;
  border-radius:9px;
  min-height:37px;
  cursor:pointer;
}
.number.done {
  background:#dbf5eb;
  border-color:#79b7ad;
}
.number.current {
  background:var(--navy);
  color:white;
}
.pill {
  display:inline-block;
  padding:3px 10px;
  background:#eaf7f5;
  border-radius:30px;
  color:#12756d;
  font-size:12px;
  margin:3px 5px 3px 0;
}
h2 {font-size:23px;line-height:1.4}
.stem {
  white-space:pre-wrap;
  font-size:17px;
  margin:13px 0 22px;
}
.option {
  display:flex;
  gap:12px;
  align-items:flex-start;
  border:1.5px solid var(--edge);
  border-radius:11px;
  padding:13px;
  margin:9px 0;
  cursor:pointer;
}
.option.checked {
  border-color:var(--teal);
  background:#f0faf7;
}
.option input {
  margin-top:7px;
  accent-color:var(--teal);
}
.option span {flex:1}
.score {
  font-weight:780;
  font-size:39px;
  color:var(--teal);
}
.metrics {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:18px 0;
}
.metric {
  background:#f2f6f7;
  border-radius:10px;
  padding:12px;
  text-align:center;
}
.metric strong {
  display:block;
  font-size:23px;
}
.skill {margin:16px 0}
.skill-track {
  height:11px;
  border-radius:30px;
  background:#e4eaea;
  overflow:hidden;
}
.skill-track div {
  height:100%;
  background:var(--teal);
}
.review {
  border:1px solid var(--edge);
  border-radius:12px;
  padding:16px;
  margin:13px 0;
}
.review .explain {
  background:#f1f8f7;
  border-left:3px solid var(--teal);
  padding:9px 12px;
}
.correct {color:#0b7563}
.wrong {color:var(--red)}

/* 教師後台 */
.teacher-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}
.cards .card {
  background:white;
  border:1px solid var(--edge);
  border-radius:12px;
  padding:13px;
}
.cards .card strong {
  display:block;
  font-size:25px;
}
.filters {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:end;
  background:white;
  padding:13px;
  border:1px solid var(--edge);
  border-radius:12px;
}
.filters label {
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:13px;
}
.filters input,
.filters select {
  font:inherit;
  padding:8px;
  border:1px solid var(--edge);
  border-radius:8px;
  max-width:200px;
}
.teacher-nav {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0;
}
.teacher-section {
  background:white;
  padding:15px;
  border:1px solid var(--edge);
  border-radius:12px;
}
.scroller {
  max-height:475px;
  overflow:auto;
}
table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td {
  text-align:left;
  border-bottom:1px solid #e6eded;
  padding:9px 7px;
  vertical-align:top;
}
th {
  background:#f2f7f7;
  position:sticky;
  top:0;
}
.detail {
  padding:13px;
  border:1px solid var(--edge);
  border-radius:9px;
  margin:10px 0;
}
.detail summary {cursor:pointer;font-weight:650}
.detail p {white-space:pre-wrap}
.bar {
  height:9px;
  background:#e5eff0;
  border-radius:15px;
  width:110px;
  overflow:hidden;
}
.bar div {
  height:100%;
  background:#cc6b5d;
}
footer {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:18px;
}
@media(max-width:760px) {
  .layout {grid-template-columns:1fr}
  .aside {position:static}
  .numbers {grid-template-columns:repeat(8,1fr)}
  .student {grid-template-columns:1fr}
  .cards {grid-template-columns:repeat(2,1fr)}
  .filters {display:grid;grid-template-columns:1fr 1fr}
}
@media(max-width:580px) {
  .role-grid {grid-template-columns:1fr}
  .panel {padding:16px}
  .filters {grid-template-columns:1fr}
  .teacher-heading {
    align-items:flex-start;
    flex-direction:column;
  }
}
@media print {
  header,.aside,.student,.actions,
  .mode-bar,footer {display:none!important}
  main {margin:0}
  .review {break-inside:avoid}
}
</style>
</head>

<body>

<header>
  <h1>化學鍵與物質結構</h1>
  <p>學測化學補強｜15 題診斷｜滿分 30 分</p>
</header>

<main>

<section id="rolePanel" class="panel role-panel">
  <h2>請選擇您的身分</h2>
  <p class="small">學生直接作答，教師須輸入密碼。</p>

  <div class="role-grid">
    <button id="roleStudent" class="role-choice">
      <span class="role-icon">🎓</span>
      <strong>我是學生</strong>
      <small>開始 15 題化學診斷測驗</small>
    </button>

    <button id="roleTeacher" class="role-choice">
      <span class="role-icon">📊</span>
      <strong>我是教師</strong>
      <small>密碼登入、查看錯題分析</small>
    </button>
  </div>
</section>

<div id="modeBar" class="mode-bar hidden">
  <button id="backToRoles" class="btn">
    返回身分選擇
  </button>
  <span id="modeLabel"></span>
</div>

<section id="teacherLoginPanel" class="panel hidden">
  <h2>教師身分驗證</h2>
  <p class="small">
    密碼由 Apps Script 驗證，不寫入 GitHub。
  </p>
  <label class="field">
    教師密碼
    <input id="teacherPassword"
           type="password"
           autocomplete="current-password"
           maxlength="128">
  </label>
  <div class="actions">
    <button id="teacherLoginBtn" class="btn primary">
      登入教師後台
    </button>
  </div>
  <p id="loginMessage"
     class="notice warning hidden"></p>
</section>

<div id="studentApp" class="hidden">

  <section class="panel student">
    <label class="field">
      班級
      <input id="className" type="text"
             maxlength="20" placeholder="例如 301">
    </label>
    <label class="field">
      座號
      <input id="seat" type="text"
             maxlength="8" placeholder="例如 08">
    </label>
    <label class="field">
      姓名
      <input id="studentName" type="text"
             maxlength="40" placeholder="請填姓名">
    </label>
  </section>

  <div id="notice" class="notice">
    題庫已內嵌，可以直接開始作答。
  </div>

  <div class="layout">
    <aside class="panel aside">
      <strong>作答進度</strong>
      <span id="progressText"></span>
      <div class="progress">
        <div id="progressFill"></div>
      </div>
      <div class="numbers" id="numbers"></div>
      <p class="small">
        綠色代表已作答，可點題號跳題。
      </p>
    </aside>

    <section id="quizPanel" class="panel">
      <span id="skill" class="pill"></span>
      <span id="type" class="pill"></span>
      <h2 id="qTitle"></h2>
      <div id="stem" class="stem"></div>
      <div id="options"></div>

      <div class="actions">
        <button id="prev" class="btn">上一題</button>
        <button id="clear" class="btn">清除此題</button>
        <button id="next" class="btn primary">下一題</button>
        <button id="submit" class="btn primary">
          交卷並記錄成績
        </button>
      </div>
    </section>

    <section id="resultPanel" class="panel hidden">
      <h2>化學概念診斷報告</h2>
      <div id="saveStatus" class="notice warning"></div>
      <p id="studentLabel"></p>
      <div id="score" class="score"></div>
      <div id="metrics" class="metrics"></div>

      <h3>五大概念得分</h3>
      <div id="skillStats"></div>
      <div id="advice" class="notice"></div>

      <div class="actions">
        <button id="retry" class="btn primary">
          再確認／重送成績
        </button>
        <button id="csv" class="btn">
          下載個人錯題 CSV
        </button>
        <button id="print" class="btn">
          列印分析報告
        </button>
        <button id="restart" class="btn">
          重新作答
        </button>
      </div>

      <h3>逐題訂正與詳解</h3>
      <div id="reviews"></div>
    </section>
  </div>
</div>

<div id="teacherApp" class="hidden">
  <div class="teacher-heading">
    <h2>教師錯題分析後台</h2>
    <button id="teacherLogout" class="btn">
      登出教師
    </button>
  </div>

  <div id="status" class="notice">
    正在讀取教師資料……
  </div>

  <div id="content" class="hidden">
    <div id="cards" class="cards"></div>

    <div class="filters">
      <label>
        班級
        <select id="classFilter">
          <option value="">全部班級</option>
        </select>
      </label>

      <label>
        姓名／座號
        <input id="search" type="text"
               placeholder="搜尋學生">
      </label>

      <label>
        題號
        <select id="questionFilter">
          <option value="">全部題目</option>
        </select>
      </label>

      <label>
        得分類型
        <select id="scoreFilter">
          <option value="">全部未全對</option>
          <option value="zero">零分／未答</option>
          <option value="partial">部分給分</option>
        </select>
      </label>

      <button id="refresh" class="btn">
        重新整理
      </button>
      <button id="export" class="btn">
        匯出目前錯題
      </button>
    </div>

    <div class="teacher-nav">
      <button id="tabQuestion" class="btn primary">
        各題錯誤率
      </button>
      <button id="tabStudent" class="btn">
        學生成績
      </button>
      <button id="tabWrong" class="btn">
        學生錯題
      </button>
    </div>

    <section id="questionSection"
             class="teacher-section">
      <h2>各題未全對率</h2>
      <div id="questionTable" class="scroller"></div>
    </section>

    <section id="studentSection"
             class="teacher-section hidden">
      <h2>學生作答成績</h2>
      <div id="studentTable" class="scroller"></div>
    </section>

    <section id="wrongSection"
             class="teacher-section hidden">
      <h2>學生錯題明細</h2>
      <p id="wrongCount"></p>
      <div id="wrongList" class="scroller"></div>
    </section>
  </div>
</div>

</main>

<footer>
  學生題庫內嵌網頁；教師資料由
  Google Apps Script 驗證後讀取。
</footer>

<iframe name="scoreUploadFrame"
        title="成績上傳" hidden></iframe>

<script>
'use strict';

// ====================================
// Apps Script 網址及題庫版本
// ====================================

const GAS_URL =
'https://script.google.com/macros/s/AKfycbx0DR8feZzazKXrlIOjhue6RRlXdatO6-Vrgh_kclVoT4v3PaznPIkvF3r0W-7bgoijQA/exec';

const QUIZ_VERSION =
  'bond-quiz-15-2026-11-v1';

const STORAGE_KEY =
  'bond_quiz_embedded_2026_v1';

const LETTERS=['A','B','C','D','E'];

// ====================================
// 完整 15 題
// ====================================

const QUESTIONS=[
{
  id:1,
  type:'single',
  skill:'化學鍵與路易斯結構',
  title:'電子組態與化學鍵',
  stem:'X 的電子層分布為 2、8、2；Y 的電子層分布為 2、6。X 和 Y 形成穩定化合物 Z，下列何者正確？',
  options:[
    'Z 的化學式為 XY₂，屬於共價化合物。',
    'X 與 Y 各共用兩對電子形成雙鍵。',
    'Z 的化學式為 XY，主要由正、負離子間的靜電吸引力維繫。',
    'Z 中 X 為 −2 價、Y 為 +2 價。',
    'Z 為金屬晶體，可藉自由電子導電。'
  ],
  answer:'C',
  explain:'X 是 Mg，Y 是 O；化合物為 MgO，屬於離子晶體。'
},
{
  id:2,
  type:'multiple',
  skill:'化學鍵與路易斯結構',
  title:'路易斯結構與鍵結電子對',
  stem:'氧氣 O₂ 和乙炔根 C₂²⁻ 的化學鍵敘述，哪些正確？',
  options:[
    'O₂ 中兩個氧原子之間具有兩對鍵結電子對。',
    'C₂²⁻ 中兩個碳原子間具有三對鍵結電子對。',
    'C₂²⁻ 的總價電子數為 8 個。',
    'C₂²⁻ 中每個碳原子各具有一對孤電子對。',
    'O₂ 和 C₂²⁻ 的鍵級相同。'
  ],
  answer:'ABD',
  explain:'O₂ 為雙鍵；C₂²⁻ 有 10 個價電子，碳碳間為三鍵且兩端各有一對孤電子對。'
},
{
  id:3,
  type:'multiple',
  skill:'化學鍵與路易斯結構',
  title:'離子化合物一定只有離子鍵嗎？',
  stem:'分析 MgO、CaC₂、NaOH、NH₄Cl 與 H₂O 的鍵結，哪些正確？',
  options:[
    'MgO 是由獨立 MgO 分子組成。',
    'CaC₂ 是具有共價鍵的離子化合物。',
    'NaOH 內只有離子鍵，完全沒有共價鍵。',
    'NH₄Cl 中 NH₄⁺ 內部具有 N—H 共價鍵。',
    'H₂O 中 O—H 鍵為極性共價鍵。'
  ],
  answer:'BDE',
  explain:'CaC₂ 的 C₂²⁻、NaOH 的 OH⁻ 及 NH₄Cl 的 NH₄⁺ 內部均有共價鍵；離子之間有靜電吸引力。'
},
{
  id:4,
  type:'single',
  skill:'晶體性質與導電性',
  title:'晶體性質與導電性',
  stem:'比較 NaCl、MgO、O₂、Au 的導電性與物理性質，何者正確？',
  options:[
    '固態 NaCl 可藉自由移動的 Na⁺ 導電。',
    '熔融態 MgO 可藉由移動的正、負離子導電。',
    '固態 O₂ 高熔點，因氧分子間有離子鍵。',
    '固態 Au 因電子固定而無法導電。',
    '固態 MgO 具有延展性，可拉成細線。'
  ],
  answer:'B',
  explain:'熔融態離子化合物的離子可移動；固態離子晶體通常不導電，金屬則藉離域電子導電。'
},
{
  id:5,
  type:'multiple',
  skill:'晶體性質與導電性',
  title:'氧與硫的鍵結與電解質',
  stem:'氧與硫均屬第 16 族，下列哪些敘述正確？',
  options:[
    '氧與硫原子的價電子數皆為 6。',
    'S₈ 固體主要由 S²⁻ 與正離子間的離子鍵維繫。',
    'S₈ 分子內相鄰硫原子以共價鍵結合。',
    '稀硫酸是非電解質，不產生離子。',
    '稀硫酸水溶液可導電，因為含有可移動離子。'
  ],
  answer:'ACE',
  explain:'O 與 S 皆有 6 個價電子；S₈ 為共價分子，硫酸溶液含離子而能導電。'
},
{
  id:6,
  type:'single',
  skill:'化學反應與計量',
  title:'碳化鈣反應式配平',
  stem:'磺火捕魚使用 CaC₂ 與水產生乙炔：CaC₂＋xH₂O → Ca(OH)₂＋yC₂H₂。平衡後 x、y 分別為何？',
  options:[
    'x＝1，y＝1',
    'x＝2，y＝1',
    'x＝2，y＝2',
    'x＝1，y＝2',
    'x＝3，y＝1'
  ],
  answer:'B',
  explain:'正確反應式為 CaC₂＋2H₂O → Ca(OH)₂＋C₂H₂。'
},
{
  id:7,
  type:'multiple',

const $=id=>document.getElementById(id);

function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return 'q_'+[...bytes].map(x=>
    x.toString(16).padStart(2,'0')
  ).join('');
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function postForm(payload) {
  const form=document.createElement('form');
  form.method='POST';
  form.action=GAS_URL;
  form.target='scoreUploadFrame';
  form.hidden=true;

  const input=document.createElement('input');
  input.type='hidden';
  input.name='payload';
  input.value=JSON.stringify(payload);

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  form.remove();
}

function apiJsonp(action,params={}) {
  return new Promise((resolve,reject)=>{
    const callback='cb_'+Date.now()+'_'+
      Math.random().toString(36).slice(2);

    const url=new URL(GAS_URL);
    url.searchParams.set('action',action);
    url.searchParams.set('callback',callback);

    Object.entries(params).forEach(([k,v])=>
      url.searchParams.set(k,String(v))
    );

    const script=document.createElement('script');
    script.referrerPolicy='no-referrer';

    let finished=false;

    const clean=()=>{
      clearTimeout(timer);
      script.remove();
      delete window[callback];
    };

    window[callback]=data=>{
      if(finished)return;
      finished=true;
      clean();
      resolve(data);
    };

    script.onerror=()=>{
      if(finished)return;
      finished=true;
      clean();
      reject(new Error('無法連線 Apps Script'));
    };

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      clean();
      reject(new Error('連線逾時'));
    },18000);

    script.src=url.toString();
    document.head.appendChild(script);
  });
}

function csvDownload(rows,filename) {
  const csv='\ufeff'+rows.map(row=>
    row.map(v=>'"'+String(v??'')
      .replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');

  const url=URL.createObjectURL(
    new Blob([csv],{
      type:'text/csv;charset=utf-8'
    })
  );

  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const state={
  index:0,
  answers:{},
  id:'',
  submitted:false,
  confirmed:false,
  snapshot:null,
  uploading:false
};

function identity() {
  return {
    className:$('className').value.trim(),
    seat:$('seat').value.trim(),
    name:$('studentName').value.trim()
  };
}

function picked(q) {
  return state.answers[String(q.id)] || [];
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      version:QUIZ_VERSION,
      index:state.index,
      answers:state.answers,
      id:state.id,
      submitted:state.submitted,
      confirmed:state.confirmed,
      snapshot:state.snapshot,
      identity:identity()
    }));
  } catch(e) {
    console.warn(e);
  }
}

function restore() {
  try {
    const old=JSON.parse(
      localStorage.getItem(STORAGE_KEY)||'null'
    );

    if(!old||old.version!==QUIZ_VERSION)return;

    state.index=Math.min(
      QUESTIONS.length-1,
      Math.max(0,Number(old.index)||0)
    );

    state.answers=old.answers||{};
    state.id=/^[A-Za-z0-9_-]{15,100}$/.test(
      old.id||''
    )?old.id:state.id;

    state.submitted=!!old.submitted;
    state.confirmed=!!old.confirmed;
    state.snapshot=old.snapshot||null;

    if(state.submitted&&!state.snapshot) {
      state.submitted=false;
      state.confirmed=false;
    }

    $('className').value=
      old.identity?.className||'';
    $('seat').value=old.identity?.seat||'';
    $('studentName').value=
      old.identity?.name||'';

  }catch(e) {
    console.warn(e);
  }
}

function showNotice(text,type='') {
  $('notice').textContent=text;
  $('notice').className='notice '+type;
  $('notice').classList.remove('hidden');
}

function renderNav() {
  let answered=0;
  $('numbers').replaceChildren();

  QUESTIONS.forEach((q,i)=>{
    const yes=picked(q).length>0;
    if(yes)answered++;

    const button=document.createElement('button');
    button.textContent=q.id;
    button.className='number'+
      (yes?' done':'')+
      (i===state.index?' current':'');

    button.disabled=state.submitted;
    button.onclick=()=>{
      state.index=i;
      save();
      renderQuestion();
    };

    $('numbers').appendChild(button);
  });

  $('progressText').textContent=
    answered+' / '+QUESTIONS.length;

  $('progressFill').style.width=
    answered/QUESTIONS.length*100+'%';
}

function renderQuestion() {
  $('quizPanel').classList.remove('hidden');
  $('resultPanel').classList.add('hidden');

  const q=QUESTIONS[state.index];

  $('skill').textContent=q.skill;
  $('type').textContent=
    q.type==='single'?'單選題':'多選題';

  $('qTitle').textContent=
    '第 '+q.id+' 題｜'+q.title;

  $('stem').textContent=q.stem;
  $('options').replaceChildren();

  q.options.forEach((option,i)=>{
    const letter=LETTERS[i];
    const chosen=picked(q).includes(letter);

    const label=document.createElement('label');
    label.className='option'+
      (chosen?' checked':'');

    const input=document.createElement('input');
    input.type=q.type==='single'
      ?'radio':'checkbox';
    input.name='q'+q.id;
    input.checked=chosen;

    input.onchange=()=>{
      if(q.type==='single') {
        state.answers[String(q.id)]=[letter];
      }else{
        state.answers[String(q.id)]=
          input.checked
          ? [...new Set([...picked(q),letter])]
          : picked(q).filter(x=>x!==letter);
      }

      save();
      renderQuestion();
    };

    const span=document.createElement('span');
    span.textContent='('+letter+') '+option;

    label.append(input,span);
    $('options').appendChild(label);
  });

  $('prev').disabled=state.index===0;
  $('next').disabled=
    state.index===QUESTIONS.length-1;

  renderNav();
}

function scoreOne(q,selected) {
  if(!selected.length)return 0;

  const errors=LETTERS.filter(c=>
    selected.includes(c)!==
    q.answer.includes(c)
  ).length;

  if(errors===0)return 2;
  if(q.type==='single')return 0;
  if(errors===1)return 1.2;
  if(errors===2)return 0.4;
  return 0;
}

function grade() {
  const details=QUESTIONS.map(q=>({
    q,
    selected:picked(q).slice().sort(),
    points:scoreOne(q,picked(q))
  }));

  const skills={};
  let exact=0,partial=0;

  details.forEach(d=>{
    if(d.points===2)exact++;
    else if(d.points>0)partial++;

    if(!skills[d.q.skill]) {
      skills[d.q.skill]={points:0,max:0};
    }

    skills[d.q.skill].points=+(
      skills[d.q.skill].points+d.points
    ).toFixed(1);

    skills[d.q.skill].max+=2;
  });

  return {
    score:+details.reduce(
      (s,d)=>s+d.points,0
    ).toFixed(1),
    max:30,
    exact,
    partial,
    zero:15-exact-partial,
    details,
    skills
  };
}

function buildSnapshot() {
  const g=grade();
  const who=identity();

  const wrong=g.details
    .filter(d=>d.points<2)
    .map(d=>({
      id:d.q.id,
      title:d.q.title,
      skill:d.q.skill,
      stem:d.q.stem,
      options:d.q.options,
      selected:d.selected,
      explain:d.q.explain
    }));

  return {
    submissionId:state.id,
    version:QUIZ_VERSION,
    ...who,
    answers:Object.fromEntries(
      QUESTIONS.map(q=>[
        String(q.id),
        picked(q).slice().sort()
      ])
    ),
    wrong,
    clientScore:g.score
  };
}

function lockIdentity(locked) {
  ['className','seat','studentName']
    .forEach(id=>$(id).disabled=locked);
}

function renderResult(status,confirmed) {
  const g=grade();
  const who=state.snapshot;

  $('quizPanel').classList.add('hidden');
  $('resultPanel').classList.remove('hidden');

  $('saveStatus').className=
    'notice '+(confirmed?'':'warning');

  $('saveStatus').textContent=status;

  $('studentLabel').textContent=
    who.className+' 班　'+
    who.seat+' 號　'+who.name;

  $('score').textContent=
    g.score+' / '+g.max+' 分';

  $('metrics').replaceChildren();

  [
    ['完全正確',g.exact],
    ['部分給分',g.partial],
    ['零分／未作答',g.zero]
  ].forEach(([name,num])=>{
    const div=document.createElement('div');
    div.className='metric';

    const strong=document.createElement('strong');
    strong.textContent=num;

    div.append(strong,document.createTextNode(name));
    $('metrics').appendChild(div);
  });

  $('skillStats').replaceChildren();

  Object.entries(g.skills).forEach(([name,s])=>{
    const div=document.createElement('div');
    div.className='skill';

    const title=document.createElement('div');
    title.textContent=name+'：'+s.points+
      '/'+s.max+' 分';

    const track=document.createElement('div');
    track.className='skill-track';

    const fill=document.createElement('div');
    fill.style.width=
      (s.points/s.max*100)+'%';

    track.appendChild(fill);
    div.append(title,track);
    $('skillStats').appendChild(div);
  });

  const weak=Object.entries(g.skills)
    .filter(([,s])=>s.points/s.max<.8)
    .sort((a,b)=>
      a[1].points/a[1].max-
      b[1].points/b[1].max
    );

  $('advice').textContent=weak.length
    ? '建議優先複習：'+
      weak.slice(0,3).map(x=>x[0]).join('、')
    : '所有概念得分率均達 80% 以上。';

  $('reviews').replaceChildren();

  g.details.forEach(d=>{
    const item=document.createElement('article');
    item.className='review';

    const h=document.createElement('h3');
    h.textContent=
      '第 '+d.q.id+' 題｜'+d.q.title;

    const p=document.createElement('p');
    p.className=d.points===2?'correct':'wrong';
    p.textContent=
      '得分 '+d.points+'/2｜作答：'+
      (d.selected.join('、')||'未作答')+
      '｜正解：'+d.q.answer.split('').join('、');

    const explain=document.createElement('div');
    explain.className='explain';
    explain.textContent='解析：'+d.q.explain;

    const details=document.createElement('details');
    const summary=document.createElement('summary');
    summary.textContent='查看題目與全部選項';
    details.appendChild(summary);

    const stem=document.createElement('p');
    stem.textContent=d.q.stem;
    details.appendChild(stem);

    d.q.options.forEach((opt,i)=>{
      const o=document.createElement('p');
      o.textContent='('+LETTERS[i]+') '+opt;

      if(d.q.answer.includes(LETTERS[i])) {
        o.className='correct';
      }
      details.appendChild(o);
    });

    item.append(h,p,explain,details);
    $('reviews').appendChild(item);
  });

  $('retry').classList.toggle(
    'hidden',confirmed
  );
}

function getSubmissionStatus(id) {
  return apiJsonp('status',{id});
}

async function verifyWritten() {
  for(let i=0;i<8;i++) {
    await sleep(i===0?1400:1600);

    try {
      const r=await getSubmissionStatus(state.id);
      if(r.ok&&r.recorded)return true;
    }catch(e) {
      console.warn(e.message);
    }
  }
  return false;
}

async function upload() {
  if(state.uploading ||
     state.confirmed ||
     !state.snapshot)return;

  state.uploading=true;
  $('retry').disabled=true;

  renderResult(
    '正在送出成績並確認寫入……',
    false
  );

  try {
    postForm(state.snapshot);

    const recorded=await verifyWritten();

    if(recorded) {
      state.confirmed=true;
      save();

      renderResult(
        '成績已確認寫入 Google 試算表。',
        true
      );
    }else{
      renderResult(
        '已完成計分，但尚未確認上傳成功。請按「再確認／重送成績」。',
        false
      );
    }

  }catch(e) {
    renderResult(
      '上傳失敗：'+e.message,
      false
    );
  }finally {
    state.uploading=false;
    $('retry').disabled=false;
  }
}

function submitQuiz() {
  if(state.submitted)return;

  const who=identity();

  if(!who.className||!who.seat||!who.name) {
    showNotice(
      '請先填寫班級、座號與姓名。',
      'error'
    );
    return;
  }

  const unanswered=QUESTIONS
    .filter(q=>!picked(q).length)
    .map(q=>q.id);

  const msg=unanswered.length
    ? '第 '+unanswered.join('、')+
      ' 題未作答，以 0 分計算。確定交卷？'
    : '確定交卷並將成績記錄給老師？';

  if(!confirm(msg))return;

  state.submitted=true;
  state.confirmed=false;
  state.snapshot=buildSnapshot();

  lockIdentity(true);
  save();
  $('notice').classList.add('hidden');

  upload();
}

function exportPersonalCSV() {
  const g=grade();
  const who=state.snapshot;

  const rows=[[
    '班級','座號','姓名','題號',
    '考點','你的答案','正解','得分','題目'
  ]];

  g.details.filter(d=>d.points<2)
    .forEach(d=>rows.push([
      who.className,
      who.seat,
      who.name,
      d.q.id,
      d.q.skill,
      d.selected.join(''),
      d.q.answer,
      d.points,
      d.q.stem
    ]));

  csvDownload(rows,'化學鍵個人錯題.csv');
}

function restart() {
  if(!confirm('確定重新作答？會建立新紀錄。')) {
    return;
  }

  state.index=0;
  state.answers={};
  state.id=newId();
  state.submitted=false;
  state.confirmed=false;
  state.snapshot=null;

  lockIdentity(false);
  save();
  renderQuestion();

  showNotice('已開始新的測驗。');
}

$('prev').onclick=()=>{
  if(state.index>0) {
    state.index--;
    save();
    renderQuestion();
  }
};

$('next').onclick=()=>{
  if(state.index<QUESTIONS.length-1) {
    state.index++;
    save();
    renderQuestion();
  }
};

$('clear').onclick=()=>{
  delete state.answers[
    String(QUESTIONS[state.index].id)
  ];
  save();
  renderQuestion();
};

$('submit').onclick=submitQuiz;
$('retry').onclick=upload;
$('csv').onclick=exportPersonalCSV;
$('print').onclick=()=>window.print();
$('restart').onclick=restart;

['className','seat','studentName']
  .forEach(id=>$(id).addEventListener('input',save));

function startStudent() {
  state.id=newId();
  restore();

  if(state.submitted) {
    lockIdentity(true);
    renderNav();
    renderResult(
      state.confirmed
        ? '這份答卷已記錄成功。'
        : '上次答卷尚未確認儲存，可以重送。',
      state.confirmed
    );
  }else{
    renderQuestion();
  }
}

// ====================================
// 教師後台
// ====================================

let TEACHER_TOKEN='';
let TEACHER_DATA=null;
let STUDENT_READY=false;
let ACTIVE_TAB='question';

function escapeHtml(v) {
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function mode(name) {
  $('rolePanel').classList.toggle(
    'hidden',name!=='roles'
  );

  $('studentApp').classList.toggle(
    'hidden',name!=='student'
  );

  $('teacherLoginPanel').classList.toggle(
    'hidden',name!=='login'
  );

  $('teacherApp').classList.toggle(
    'hidden',name!=='teacher'
  );

  $('modeBar').classList.toggle(
    'hidden',name==='roles'
  );

  $('modeLabel').textContent=
    name==='student'?'學生測驗':
    name==='teacher'?'教師錯題分析':
    '教師登入';

  window.scrollTo(0,0);
}

function showLogin(msg='') {
  mode('login');
  $('teacherPassword').value='';
  $('loginMessage').textContent=msg;
  $('loginMessage').classList.toggle(
    'hidden',!msg
  );
  $('teacherLoginBtn').disabled=false;
}

async function teacherLogin() {
  const password=$('teacherPassword').value;

  if(!password) {
    $('loginMessage').textContent='請輸入教師密碼。';
    $('loginMessage').classList.remove('hidden');
    return;
  }

  $('teacherPassword').value='';
  $('teacherLoginBtn').disabled=true;
  $('loginMessage').classList.remove('hidden');
  $('loginMessage').textContent='正在驗證教師密碼……';

  const loginId=newId();

  try {
    postForm({
      action:'teacherLogin',
      loginId,
      password
    });

    let response=null;

    for(let i=0;i<12;i++) {
      await sleep(i===0?1200:1300);

      try {
        const r=await apiJsonp(
          'loginStatus',{id:loginId}
        );

        if(r.found || r.ok===false) {
          response=r;
          break;
        }
      }catch(e) {
        if(i===11)throw e;
      }
    }

    if(!response) {
      throw new Error(
        '尚未收到登入結果，請確認 Apps Script 已更新部署。'
      );
    }

    if(!response.ok ||
       !response.authenticated ||
       !response.token) {
      throw new Error(
        response.error||'教師登入失敗'
      );
    }

    TEACHER_TOKEN=response.token;
    mode('teacher');
    await refreshTeacher();

  }catch(e) {
    showLogin('登入失敗：'+e.message);
  }finally {
    $('teacherLoginBtn').disabled=false;
  }
}

function teacherFilters() {
  return {
    cls:$('classFilter').value,
    text:$('search').value.trim().toLowerCase(),
    qid:$('questionFilter').value,
    score:$('scoreFilter').value
  };
}

function matchWrong(w,f) {
  return (
    (!f.cls||w.className===f.cls) &&
    (!f.text||[w.name,w.seat].some(x=>
      String(x).toLowerCase().includes(f.text)
    )) &&
    (!f.qid||String(w.questionId)===f.qid) &&
    (!f.score||(
      f.score==='zero'
        ? w.points===0
        : w.points>0&&w.points<2
    ))
  );
}

function setTeacherTab(tab) {
  ACTIVE_TAB=tab;

  ['question','student','wrong'].forEach(x=>{
    $(x+'Section').classList.toggle(
      'hidden',x!==tab
    );

    const id='tab'+
      x.charAt(0).toUpperCase()+
      x.slice(1);

    $(id).classList.toggle(
      'primary',x===tab
    );
  });

  renderTeacher();
}

function renderTeacherCards() {
  const o=TEACHER_DATA.overview;

  $('cards').innerHTML=[
    ['交卷人次',o.attempts],
    ['不同學生',o.uniqueStudents],
    ['平均分數',o.average],
    ['未全對題次',o.wrongCount]
  ].map(([name,n])=>
    '<div class="card"><small>'+
    escapeHtml(name)+'</small><strong>'+
    escapeHtml(n)+'</strong></div>'
  ).join('');
}

function renderTeacherQuestions() {
  const f=teacherFilters();
  let rows=TEACHER_DATA.questions;

  if(f.qid) {
    rows=rows.filter(q=>
      String(q.id)===f.qid
    );
  }

  $('questionTable').innerHTML=
    '<table><thead><tr>'+
    '<th>題號</th><th>題目</th><th>概念</th>'+
    '<th>交卷人次</th><th>未全對</th>'+
    '<th>部分得分</th><th>錯誤率</th>'+
    '<th>查看</th></tr></thead><tbody>'+
    rows.map(q=>
      '<tr><td>'+q.id+'</td><td>'+
      escapeHtml(q.title)+'</td><td>'+
      escapeHtml(q.skill)+'</td><td>'+
      q.attempts+'</td><td>'+q.wrong+
      '</td><td>'+q.partial+'</td><td>'+
      '<div class="bar"><div style="width:'+
      Math.round(q.wrongRate*100)+'%"></div></div>'+
      Math.round(q.wrongRate*100)+'%'+
      '</td><td><button class="btn" data-qid="'+
      q.id+'">看錯題</button></td></tr>'
    ).join('')+'</tbody></table>';

  $('questionTable')
    .querySelectorAll('[data-qid]')
    .forEach(button=>{
      button.onclick=()=>{
        $('questionFilter').value=
          button.dataset.qid;
        setTeacherTab('wrong');
      };
    });
}

function renderTeacherStudents() {
  const f=teacherFilters();

  const rows=TEACHER_DATA.attempts
    .filter(s=>
      (!f.cls||s.className===f.cls) &&
      (!f.text||[s.name,s.seat].some(x=>
        String(x).toLowerCase().includes(f.text)
      )) &&
      (!f.qid||s.wrongIds.split(',')
        .includes(f.qid))
    );

  $('studentTable').innerHTML=
    '<table><thead><tr>'+
    '<th>時間</th><th>班級</th><th>座號</th>'+
    '<th>姓名</th><th>總分</th><th>完全正確</th>'+
    '<th>部分給分</th><th>未全對題號</th>'+
    '</tr></thead><tbody>'+
    rows.map(s=>
      '<tr><td>'+escapeHtml(s.time)+
      '</td><td>'+escapeHtml(s.className)+
      '</td><td>'+escapeHtml(s.seat)+
      '</td><td>'+escapeHtml(s.name)+
      '</td><td><b>'+s.score+'/30</b>'+
      '</td><td>'+s.full+
      '</td><td>'+s.partial+
      '</td><td>'+escapeHtml(s.wrongIds||'無')+
      '</td></tr>'
    ).join('')+'</tbody></table>';
}

function renderTeacherWrong() {
  const f=teacherFilters();

  const rows=TEACHER_DATA.wrong.filter(
    w=>matchWrong(w,f)
  );

  $('wrongCount').textContent=
    '符合條件的錯題：'+rows.length+' 筆';

  $('wrongList').replaceChildren();

  rows.forEach(w=>{
    const details=document.createElement('details');
    details.className='detail';

    const summary=document.createElement('summary');
    summary.textContent=
      w.className+' 班 '+w.seat+' 號 '+w.name+
      '｜第 '+w.questionId+' 題 '+w.title+
      '｜'+w.points+'/2 分';

    const p=document.createElement('p');
    p.textContent=
      '學生答案：'+(w.selected||'未答')+
      '｜正解：'+w.correct+
      '｜'+w.kind;

    const stem=document.createElement('p');
    stem.textContent=w.stem;

    details.append(summary,p,stem);

    (w.options||[]).forEach((opt,i)=>{
      const item=document.createElement('p');
      item.textContent=
        '('+LETTERS[i]+') '+opt;

      if(w.correct.includes(LETTERS[i])) {
        item.className='correct';
      }
      details.appendChild(item);
    });

    const explain=document.createElement('p');
    explain.textContent='解析：'+w.explain;
    details.appendChild(explain);

    $('wrongList').appendChild(details);
  });

  if(!rows.length) {
    $('wrongList').textContent=
      '目前沒有符合條件的錯題。';
  }
}

function renderTeacher() {
  if(!TEACHER_DATA)return;

  renderTeacherCards();
  renderTeacherQuestions();
  renderTeacherStudents();
  renderTeacherWrong();
}

function populateTeacherFilters() {
  $('classFilter').innerHTML=
    '<option value="">全部班級</option>'+
    TEACHER_DATA.classes.map(c=>
      '<option value="'+escapeHtml(c)+'">'+
      escapeHtml(c)+'</option>'
    ).join('');

  $('questionFilter').innerHTML=
    '<option value="">全部題目</option>'+
    TEACHER_DATA.questions
      .slice().sort((a,b)=>a.id-b.id)
      .map(q=>
        '<option value="'+q.id+'">'+
        '第'+q.id+'題 '+
        escapeHtml(q.title)+'</option>'
      ).join('');
}

async function refreshTeacher() {
  $('status').classList.remove('hidden');
  $('status').textContent='正在讀取最新成績……';

  if(!TEACHER_TOKEN) {
    showLogin('登入已過期，請重新輸入密碼。');
    return;
  }

  try {
    const r=await apiJsonp('teacherData',{
      token:TEACHER_TOKEN
    });

    if(!r.ok) {
      throw new Error(
        r.error||'教師資料讀取失敗'
      );
    }

    TEACHER_DATA=r.report;
    populateTeacherFilters();
    renderTeacher();

    $('status').classList.add('hidden');
    $('content').classList.remove('hidden');

  }catch(e) {
    $('status').textContent=
      '讀取失敗：'+e.message;

    if(/登入|憑證|過期/.test(e.message)) {
      TEACHER_TOKEN='';
      TEACHER_DATA=null;
      showLogin('請重新輸入教師密碼。');
    }
  }
}

function exportTeacherCSV() {
  if(!TEACHER_DATA)return;

  const rows=[[
    '班級','座號','姓名','題號','題目',
    '考點','學生答案','正解','得分',
    '錯誤類型','題幹'
  ]];

  TEACHER_DATA.wrong
    .filter(w=>matchWrong(w,teacherFilters()))
    .forEach(w=>rows.push([
      w.className,
      w.seat,
      w.name,
      w.questionId,
      w.title,
      w.skill,
      w.selected,
      w.correct,
      w.points,
      w.kind,
      w.stem
    ]));

  csvDownload(rows,'教師錯題分析.csv');
}

function clearTeacher() {
  const token=TEACHER_TOKEN;

  TEACHER_TOKEN='';
  TEACHER_DATA=null;

  $('content').classList.add('hidden');

  ['cards','questionTable',
   'studentTable','wrongList']
    .forEach(id=>$(id).replaceChildren());

  $('teacherPassword').value='';

  if(token) {
    postForm({
      action:'teacherLogout',
      token
    });
  }
}

// ====================================
// 事件與進站身分選擇
// ====================================

$('roleStudent').onclick=()=>{
  if(!STUDENT_READY) {
    startStudent();
    STUDENT_READY=true;
  }
  mode('student');
};

$('roleTeacher').onclick=()=>{
  if(TEACHER_TOKEN) {
    mode('teacher');
    refreshTeacher();
  }else{
    showLogin();
  }
};

$('backToRoles').onclick=()=>{
  if(!$('teacherApp').classList.contains('hidden')) {
    clearTeacher();
  }
  mode('roles');
};

$('teacherLoginBtn').onclick=teacherLogin;

$('teacherPassword').addEventListener(
  'keydown',e=>{
    if(e.key==='Enter')teacherLogin();
  }
);

$('teacherLogout').onclick=()=>{
  clearTeacher();
  mode('roles');
};

$('tabQuestion').onclick=()=>
  setTeacherTab('question');

$('tabStudent').onclick=()=>
  setTeacherTab('student');

$('tabWrong').onclick=()=>
  setTeacherTab('wrong');

['classFilter','questionFilter','scoreFilter']
  .forEach(id=>$(id).onchange=renderTeacher);

$('search').oninput=renderTeacher;
$('refresh').onclick=refreshTeacher;
$('export').onclick=exportTeacherCSV;

// 網頁啟動：先選學生或教師
mode('roles');

</script>
