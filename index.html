<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化學鍵與物質結構｜15 題學測診斷</title>
<style>
:root{--ink:#173246;--teal:#147c78;--bg:#f3f6f8;--muted:#667e8b;--border:#d9e4e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{background:linear-gradient(120deg,#173246,#176e72);padding:35px 18px 54px;text-align:center;color:#fff}
header h1{font-size:clamp(24px,5vw,35px);margin:0}header p{margin:7px 0;color:#d9eff0}
main{max-width:1000px;margin:-28px auto 40px;padding:0 16px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #1231}
.student{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-size:14px;font-weight:700}.field input{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #bed1d9;border-radius:9px;font:inherit}
.layout{display:grid;grid-template-columns:215px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.count{display:flex;justify-content:space-between}.meter{height:9px;background:#e6edef;border-radius:20px;overflow:hidden;margin:13px 0}.meter>div{height:100%;width:0;background:var(--teal);transition:.2s}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.nav button{border-radius:8px;border:1px solid var(--border);padding:7px 0;background:#fff;cursor:pointer}.nav button.done{background:#d9f1e9;border-color:#83beb3}.nav button.active{background:var(--ink);color:#fff}
.tag{display:inline-block;border-radius:20px;color:#116b66;background:#e6f5f2;padding:3px 10px;margin-right:5px;font-size:12px}h2{font-size:24px;margin:16px 0}.stem{white-space:pre-wrap;font-size:17px;margin-bottom:18px}.option{display:flex;gap:12px;align-items:start;padding:14px;margin:11px 0;border:1.5px solid var(--border);border-radius:10px;cursor:pointer}.option.selected{background:#e9f6f2;border-color:var(--teal)}.option input{accent-color:var(--teal);margin-top:7px}.option span{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}button{font:inherit;cursor:pointer}.btn{padding:10px 17px;border:1px solid var(--border);border-radius:10px;background:#fff;font-weight:700}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.notice{border-radius:10px;background:#e7f3f1;padding:12px 15px;margin-bottom:16px}.notice.error{background:#ffebe9;color:#a33e3e}.notice.warn{background:#fff2d8;color:#7b5216}
.big{font-size:40px;color:var(--teal);font-weight:800}.result-info{color:var(--muted);font-size:14px}.skill{margin:14px 0}.skill .track{height:10px;background:#e9eef0;border-radius:9px;overflow:hidden}.skill .track div{height:100%;background:var(--teal)}.review{padding:16px;border:1px solid var(--border);border-radius:12px;margin:14px 0}.review h3{margin:0 0 8px}.correct{color:#126c54;font-weight:700}.wrong{color:#ab4747;font-weight:700}.explain{padding:10px 12px;background:#f0f7f6;border-left:3px solid var(--teal);margin-top:10px}.scoreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scoreGrid div{background:#f1f5f7;text-align:center;padding:12px;border-radius:9px}.scoreGrid strong{display:block;font-size:23px}footer{text-align:center;padding:18px;color:var(--muted);font-size:13px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(8,1fr)}}@media(max-width:520px){.student{grid-template-columns:1fr}.card{padding:16px}h2{font-size:21px}}@media print{header,.student,.side,.actions,.notice,footer{display:none!important}main{margin:0}.card{box-shadow:none}.review{break-inside:avoid}}
</style>
</head>
<body>
<header><h1>化學鍵與物質結構</h1><p>學測化學補強｜15 題互動診斷｜滿分 30 分</p></header>
<main>
  <section class="card student">
    <label class="field">學生姓名<input id="student" maxlength="40" placeholder="請填姓名" autocomplete="name"></label>
    <label class="field">班級／座號<input id="classroom" maxlength="40" placeholder="例如：301／08"></label>
  </section>
  <div id="notice" class="notice">正在從 Google 試算表讀取題庫……</div>
  <div class="layout">
    <aside class="card side"><div class="count"><b>作答進度</b><span id="progressText">0 / 15</span></div><div class="meter"><div id="progressBar"></div></div><div class="nav" id="nav"></div><p style="font-size:12px;color:#667e8b">綠色代表已作答；可點選題號跳題。交卷後顯示答案與解析。</p></aside>
    <section class="card hidden" id="quizPanel">
      <div><span class="tag" id="category"></span><span class="tag" id="type"></span></div>
      <h2 id="qTitle"></h2><div class="stem" id="stem"></div><div id="options"></div>
      <div class="actions">
        <button class="btn" id="prev">上一題</button>
        <button class="btn" id="clear">清除此題</button>
        <button class="btn primary" id="next">下一題</button>
        <button class="btn primary" id="submit">交卷並上傳成績</button>
      </div>
    </section>
    <section class="card hidden" id="resultPanel">
      <h2>化學概念診斷報告</h2>
      <div id="saveStatus" class="notice warn">交卷處理中……</div>
      <div class="result-info" id="studentLabel"></div>
      <div class="big" id="total"></div>
      <div class="scoreGrid" id="scoreGrid"></div>
      <h3>五大概念得分</h3><div id="skills"></div>
      <div class="notice" id="advice"></div>
      <div class="actions">
        <button class="btn" id="retryUpload">再確認／重送紀錄</button>
        <button class="btn" id="download">下載 CSV</button>
        <button class="btn" id="print">列印報告</button>
        <button class="btn" id="restart">重新練習</button>
      </div>
      <h3>逐題答案與解析</h3><div id="reviews"></div>
    </section>
  </div>
</main>
<footer>題庫、答案公開供練習使用；成績僅儲存在教師的私人試算表。</footer>
<iframe name="quizUploadFrame" id="quizUploadFrame" hidden title="成績提交"></iframe>
<script>
'use strict';
// ★ 唯一需要修改的地方：貼上你的 Apps Script 網頁應用程式 /exec 網址
const GAS_URL = 'https://script.google.com/macros/s/貼上你的部署ID/exec';
const STORE_KEY = 'chem_bond_simple_v1';
const LETTERS = ['A','B','C','D','E'];
const el = id => document.getElementById(id);
const state = {questions:[],version:'',index:0,answers:{},submissionId:'',confirmed:false,submitting:false};

// JSONP: 直接讀 Apps Script 公開題庫與寫入狀態；不需要 CORS 代理。
function apiGet(action, extra={}) {
  return new Promise((resolve,reject)=>{
    const callback = 'cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const url = new URL(GAS_URL);
    url.searchParams.set('action',action);
    url.searchParams.set('callback',callback);
    Object.entries(extra).forEach(([k,v])=>url.searchParams.set(k,v));
    let done = false;
    const clean = () => { clearTimeout(timer); script.remove(); delete window[callback]; };
    window[callback] = data => { if(done)return;done=true;clean();resolve(data); };
    script.onerror = () => {if(done)return;done=true;clean();reject(new Error('連線失敗，請檢查網址或權限'));};
    const timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('讀取逾時'));},action==='status'?7000:25000);
    script.src=url.toString();
    document.head.appendChild(script);
  });
}
function makeId(){return crypto.randomUUID ? crypto.randomUUID() : ('qid_'+Date.now()+'_'+Math.random().toString(36).slice(2));}
function notice(message,kind='') {el('notice').textContent=message;el('notice').className='notice '+kind;el('notice').classList.remove('hidden');}
function hideNotice(){el('notice').classList.add('hidden');}
function selected(q){return state.answers[String(q.id)]||[];}
function save(){
  try {localStorage.setItem(STORE_KEY,JSON.stringify({version:state.version,index:state.index,answers:state.answers,submissionId:state.submissionId,confirmed:state.confirmed,name:el('student').value,classroom:el('classroom').value}));}catch(e){console.warn(e);}
}
function restore(){
  try{
    const previous=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(!previous||previous.version!==state.version)return;
    state.index=Math.max(0,Math.min(state.questions.length-1,Number(previous.index)||0));
    state.answers=previous.answers&&typeof previous.answers==='object'?previous.answers:{};
    if(/^[a-zA-Z0-9_-]{15,100}$/.test(previous.submissionId||''))state.submissionId=previous.submissionId;
    state.confirmed=!!previous.confirmed;
    el('student').value=previous.name||'';
    el('classroom').value=previous.classroom||'';
  }catch(e){console.warn(e);}
}
function renderNav(){
  let answered=0;el('nav').replaceChildren();
  state.questions.forEach((q,i)=>{
    const has=selected(q).length>0;if(has)answered++;
    const b=document.createElement('button');b.textContent=q.id;
    b.className=(has?'done ':'')+(i===state.index?'active':'');
    b.onclick=()=>{state.index=i;save();renderQuestion();};
    el('nav').appendChild(b);
  });
  el('progressText').textContent=answered+' / '+state.questions.length;
  el('progressBar').style.width=(answered/state.questions.length*100)+'%';
}
function renderQuestion(){
  el('resultPanel').classList.add('hidden');el('quizPanel').classList.remove('hidden');
  const q=state.questions[state.index];
  el('category').textContent=q.skill;el('type').textContent=q.type==='single'?'單選':'多選';
  el('qTitle').textContent='第 '+q.id+' 題｜'+q.title;
  el('stem').textContent=q.stem;
  el('options').replaceChildren();
  q.options.forEach((option,i)=>{
    const letter=LETTERS[i], checked=selected(q).includes(letter);
    const label=document.createElement('label');label.className='option'+(checked?' selected':'');
    const input=document.createElement('input');input.type=q.type==='single'?'radio':'checkbox';
    input.name='q'+q.id;input.checked=checked;
    input.onchange=()=>{
      if(q.type==='single')state.answers[String(q.id)]=[letter];
      else state.answers[String(q.id)]=input.checked?[...new Set([...selected(q),letter])]:selected(q).filter(x=>x!==letter);
      state.confirmed=false;save();renderQuestion();
    };
    const span=document.createElement('span');span.textContent='('+letter+') '+option;
    label.append(input,span);el('options').appendChild(label);
  });
  el('prev').disabled=state.index===0;
  el('next').disabled=state.index===state.questions.length-1;
  renderNav();
}
function grade(){
  let total=0,exact=0,partial=0;const skills={},details=[];
  state.questions.forEach(q=>{
    const picked=selected(q);
    const errors=LETTERS.filter(c=>picked.includes(c)!==q.answer.includes(c)).length;
    const pts=!picked.length?0:errors===0?2:q.type==='single'?0:errors===1?1.2:errors===2?.4:0;
    total+=pts;if(pts===2)exact++;else if(pts>0)partial++;
    if(!skills[q.skill])skills[q.skill]={earned:0,max:0};
    skills[q.skill].earned=+(skills[q.skill].earned+pts).toFixed(1);
    skills[q.skill].max+=2;
    details.push({q,picked,pts});
  });
  return {total:+total.toFixed(1),max:state.questions.length*2,exact,partial,zero:state.questions.length-exact-partial,skills,details};
}
function renderResults(statusText='',confirmed=false){
  const g=grade();el('quizPanel').classList.add('hidden');el('resultPanel').classList.remove('hidden');
  el('saveStatus').className='notice '+(confirmed?'':'warn');
  el('saveStatus').textContent=statusText||(confirmed?'已經確認：成績寫入 Google 試算表':'正在確認試算表是否收到成績……');
  el('studentLabel').textContent=el('classroom').value+'　'+el('student').value;
  el('total').textContent=g.total+' / '+g.max+' 分';
  el('scoreGrid').replaceChildren();
  [['完全正確',g.exact],['部分給分',g.partial],['零分／未答',g.zero]].forEach(([label,num])=>{
    const d=document.createElement('div');const strong=document.createElement('strong');strong.textContent=num;d.append(strong,document.createTextNode(label));el('scoreGrid').appendChild(d);
  });
  el('skills').replaceChildren();
  Object.entries(g.skills).forEach(([name,s])=>{
    const d=document.createElement('div');d.className='skill';
    const t=document.createElement('div');t.textContent=name+'：'+s.earned+'/'+s.max+'（'+Math.round(s.earned/s.max*100)+'%）';
    const bar=document.createElement('div');bar.className='track';
    const fill=document.createElement('div');fill.style.width=(s.earned/s.max*100)+'%';bar.appendChild(fill);d.append(t,bar);el('skills').appendChild(d);
  });
  const weak=Object.entries(g.skills).filter(([_,s])=>s.earned/s.max<.8).sort((a,b)=>a[1].earned/a[1].max-b[1].earned/b[1].max);
  el('advice').textContent=weak.length?'建議加強：'+weak.map(x=>x[0]).slice(0,3).join('、'):'五大化學概念得分率均達 80% 以上。';
  el('reviews').replaceChildren();
  g.details.forEach(({q,picked,pts})=>{
    const d=document.createElement('section');d.className='review';
    const h=document.createElement('h3');h.textContent='第 '+q.id+' 題｜'+q.title;
    const p=document.createElement('p');p.className=pts===2?'correct':'wrong';p.textContent='得分：'+pts+'/2；你的答案：'+(picked.join('、')||'未作答')+'；正解：'+q.answer.split('').join('、');
    const e=document.createElement('div');e.className='explain';e.textContent='解析：'+q.explain;
    d.append(h,p,e);el('reviews').appendChild(d);
  });
  el('retryUpload').classList.toggle('hidden',confirmed);
}
function postToSheet(payload){
  // 以原生 HTML 表單提交，避開跨網域 fetch 的 CORS 限制。
  // iframe 的內容無法跨網域讀取；之後以 JSONP 查詢交卷ID驗證是否寫入。
  const form=document.createElement('form');form.method='POST';form.action=GAS_URL;form.target='quizUploadFrame';form.style.display='none';
  const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);
  form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();
}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function waitForRecord(id){
  for(let i=0;i<15;i++){
    await sleep(i===0?900:1700);
    try{
      const result=await apiGet('status',{id});
      if(result.ok&&result.found)return result;
    }catch(err){console.warn('確認第 '+(i+1)+' 次失敗',err.message);}
  }
  return null;
}
async function submit(){
  if(state.submitting)return;
  const name=el('student').value.trim(),classroom=el('classroom').value.trim();
  if(!name||!classroom){notice('請先填學生姓名與班級座號。','error');return;}
  const missing=state.questions.filter(q=>!selected(q).length).map(q=>q.id);
  const msg=missing.length?'未作答題號：'+missing.join('、')+'。未答以 0 分計，確定交卷？':'確定交卷並上傳成績？';
  if(!confirm(msg))return;
  state.submitting=true;el('submit').disabled=true;el('student').disabled=true;el('classroom').disabled=true;
  hideNotice();renderResults('交卷已送出，正在向 Google 試算表確認寫入……');
  // 已確認過的交卷不可再修改；新一次練習會換一個ID。
  const payload={id:state.submissionId,name,classroom,version:state.version,answers:state.answers};
  try{
    postToSheet(payload);
    const check=await waitForRecord(state.submissionId);
    if(check){
      state.confirmed=true;save();
      const g=grade();
      const consistent=Number(check.score)===g.total;
      renderResults(consistent?'已確認：成績成功寫入教師 Google 試算表。':'已確認寫入，但前後端分數不同，請通知教師核對。',true);
    }else{
      renderResults('尚未能確認成績已存入。請按「再確認／重送紀錄」，或請教師查看試算表。');
    }
  }catch(err){renderResults('提交出現問題：'+err.message+'。請再確認／重送。');}
  finally{state.submitting=false;el('submit').disabled=false;}
}
async function retryUpload(){
  if(state.confirmed)return;
  // 同交卷ID可重送；Apps Script 會自動防止重複紀錄。
  await submit();
}
function downloadCsv(){
  const g=grade();const rows=[['題號','概念','選項','正解','得分']];
  g.details.forEach(({q,picked,pts})=>rows.push([q.id,q.skill,picked.join(''),q.answer,pts]));
  rows.push(['總分','','','',g.total]);
  const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='化學鍵測驗成績.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function load(){
  if(GAS_URL.includes('https://script.google.com/macros/s/AKfycbzPDMCrr0V3t8RMxhKuzFRcCjY2Et4uNQE7DGHA8Q0ePw7ozH1QO0e3w0iuprNdoY9ybg/exec')){notice('請先把 index.html 的 GAS_URL 換成 Apps Script /exec 網址。','error');return;}
  try{
    const data=await apiGet('quiz');
    if(!data.ok||!Array.isArray(data.questions)||!data.questions.length)throw new Error(data.error||'題庫為空');
    state.questions=data.questions;state.version=data.version;state.submissionId=makeId();restore();hideNotice();
    if(state.confirmed){el('student').disabled=true;el('classroom').disabled=true;renderNav();renderResults('這是此瀏覽器上次已確認送出的作答紀錄。',true);}
    else{renderQuestion();}
  }catch(err){notice('載入失敗：'+err.message+'。請檢查 Apps Script 部署設定。','error');}
}
el('prev').onclick=()=>{if(state.index>0){state.index--;save();renderQuestion();}};
el('next').onclick=()=>{if(state.index<state.questions.length-1){state.index++;save();renderQuestion();}};
el('clear').onclick=()=>{delete state.answers[String(state.questions[state.index].id)];save();renderQuestion();};
el('submit').onclick=submit;el('retryUpload').onclick=retryUpload;
el('download').onclick=downloadCsv;el('print').onclick=()=>window.print();
el('restart').onclick=()=>{if(!confirm('確定重新開始？舊成績不會從試算表刪除。'))return;state.answers={};state.index=0;state.confirmed=false;state.submissionId=makeId();el('student').disabled=false;el('classroom').disabled=false;save();renderQuestion();};
el('student').addEventListener('input',save);el('classroom').addEventListener('input',save);
load();
</script>
</body>
</html>
