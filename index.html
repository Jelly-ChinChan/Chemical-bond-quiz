
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化學鍵與物質結構｜15題診斷測驗</title>
<style>
:root{
  --navy:#153950;
  --teal:#087e78;
  --bg:#f1f5f7;
  --ink:#203c49;
  --muted:#637984;
  --line:#dbe5e9;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,"Microsoft JhengHei",sans-serif;
  line-height:1.65;
}
header{
  background:linear-gradient(115deg,#153950,#0d7777);
  color:white;
  padding:34px 15px 55px;
  text-align:center;
}
header h1{font-size:30px;margin:0 0 8px}
header p{margin:0;color:#d5efed}
main{
  max-width:1060px;
  padding:0 14px;
  margin:-25px auto 45px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px #1231;
}
.hidden{display:none!important}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{
  padding:10px 15px;
  border-radius:9px;
  border:1px solid var(--line);
  background:white;
  font-weight:650;
}
.primary{
  background:var(--teal);
  border-color:var(--teal);
  color:white;
}
.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.notice{
  background:#e6f3f0;
  border-radius:9px;
  padding:12px;
  margin-bottom:14px;
}
.warn{background:#fff1d9;color:#805313}
.error{background:#ffebea;color:#a63b3b}
.small{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],select{
  border:1px solid #bdcdd4;
  padding:11px;
  border-radius:9px;
  width:100%;
  background:white;
}
label.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-weight:650;
}
.roles{
  max-width:750px;
  margin:20px auto;
  text-align:center;
}
.rolegrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:22px;
}
.role{
  background:#f8fcfc;
  border:2px solid var(--line);
  border-radius:15px;
  padding:28px 12px;
  color:var(--navy);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.role:hover{border-color:var(--teal)}
.role .emoji{font-size:40px}
.role strong{font-size:22px}
.modebar{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  margin-bottom:13px;
  border-radius:10px;
  background:white;
}
.studentFields{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.layout{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:15px;
  align-items:start;
}
.sidebar{position:sticky;top:10px}
.progress{
  height:10px;
  background:#e3edef;
  border-radius:15px;
  overflow:hidden;
  margin:12px 0;
}
.progress div{
  height:100%;
  width:0;
  background:var(--teal);
}
.numbergrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.num{
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
  padding:7px 0;
}
.num.done{background:#d9f4e9}
.num.active{background:var(--navy);color:white}
.tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  background:#eaf7f5;
  color:var(--teal);
  margin-right:5px;
  font-size:12px;
}
.stem{
  font-size:17px;
  white-space:pre-wrap;
  margin:18px 0;
}
.option{
  display:flex;
  gap:12px;
  padding:13px;
  border:1.5px solid var(--line);
  border-radius:10px;
  margin:9px 0;
  cursor:pointer;
}
.option.checked{
  background:#eaf8f3;
  border-color:var(--teal);
}
.option input{margin-top:7px;accent-color:var(--teal)}
.option span{flex:1}
.bigscore{
  color:var(--teal);
  font-size:38px;
  font-weight:800;
}
.metrics,.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0;
}
.metric{
  background:#f1f6f7;
  border-radius:10px;
  padding:12px;
  text-align:center;
}
.metric strong{display:block;font-size:24px}
.skill{margin:15px 0}
.track{
  height:10px;
  background:#e3edef;
  border-radius:10px;
  overflow:hidden;
}
.track div{height:100%;background:var(--teal)}
.review{
  border:1px solid var(--line);
  padding:14px;
  border-radius:10px;
  margin:12px 0;
}
.review h3{margin:0}
.correct{color:#08775d;font-weight:650}
.wrong{color:#b44545;font-weight:650}
.explain{
  background:#eff8f6;
  padding:10px;
  border-left:3px solid var(--teal);
  margin-top:10px;
}
#teacherLoginPanel{max-width:520px;margin:auto}
.filtergrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:15px 0;
}
.filtergrid label{font-size:13px}
.teacherTabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0;
}
.tablewrap{
  overflow:auto;
  max-height:470px;
}
table{
  border-collapse:collapse;
  width:100%;
  min-width:620px;
  font-size:13px;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:9px;
  text-align:left;
  vertical-align:top;
}
th{
  background:#f2f7f7;
  position:sticky;
  top:0;
}
.detail{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin:10px 0;
}
.detail summary{cursor:pointer;font-weight:650}
.detail p{white-space:pre-wrap}
footer{
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}
@media(max-width:750px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static}
  .studentFields{grid-template-columns:1fr}
  .filtergrid{grid-template-columns:1fr 1fr}
  .numbergrid{grid-template-columns:repeat(8,1fr)}
}
@media(max-width:500px){
  .rolegrid{grid-template-columns:1fr}
  .filtergrid{grid-template-columns:1fr}
  .card{padding:15px}
  header h1{font-size:26px}
}
@media print{
  header,.sidebar,.actions,.modebar,footer{display:none!important}
  main{margin:0}
  .review{break-inside:avoid}
}
</style>
</head>

<body>
<header>
  <h1>化學鍵與物質結構</h1>
  <p>學測化學補強｜15 題診斷｜滿分 30 分</p>
</header>

<main>

<section class="card roles" id="roles">
  <h2>請選擇您的身分</h2>
  <p class="small">學生直接作答，教師輸入專用密碼。</p>
  <div class="rolegrid">
    <button class="role" id="studentRole">
      <span class="emoji">🎓</span>
      <strong>我是學生</strong>
      <span>開始15題化學測驗</span>
    </button>
    <button class="role" id="teacherRole">
      <span class="emoji">📊</span>
      <strong>我是教師</strong>
      <span>登入教師錯題分析</span>
    </button>
  </div>
</section>

<div class="modebar hidden" id="modebar">
  <button class="btn" id="back">返回身分選擇</button>
  <strong id="modeLabel"></strong>
</div>

<section class="card hidden" id="teacherLoginPanel">
  <h2>教師身分驗證</h2>
  <p class="small">教師密碼由 Apps Script 驗證。</p>
  <label class="field">
    教師密碼
    <input type="password" id="teacherPassword" maxlength="128">
  </label>
  <div class="actions">
    <button class="btn primary" id="loginBtn">登入後台</button>
  </div>
  <div class="notice hidden" id="loginMsg"></div>
</section>

<div id="studentApp" class="hidden">

<section class="card studentFields">
  <label class="field">班級
    <input type="text" id="className" placeholder="例如 301" maxlength="20">
  </label>
  <label class="field">座號
    <input type="text" id="seat" placeholder="例如 08" maxlength="8">
  </label>
  <label class="field">學生姓名
    <input type="text" id="studentName" placeholder="請輸入姓名" maxlength="40">
  </label>
</section>

<div class="notice" id="studentNotice">
  題庫已內嵌，可直接開始作答。
</div>

<div class="layout">

<aside class="card sidebar">
  <strong>作答進度：</strong>
  <span id="progressText">0 / 15</span>
  <div class="progress">
    <div id="progressFill"></div>
  </div>
  <div class="numbergrid" id="numbergrid"></div>
  <p class="small">綠色代表已作答，可直接點選題號。</p>
</aside>

<section class="card" id="quizPanel">
  <span class="tag" id="skill"></span>
  <span class="tag" id="qtype"></span>
  <h2 id="questionTitle"></h2>
  <div class="stem" id="questionStem"></div>
  <div id="options"></div>
  <div class="actions">
    <button class="btn" id="prev">上一題</button>
    <button class="btn" id="clear">清除此題</button>
    <button class="btn primary" id="next">下一題</button>
    <button class="btn primary" id="submit">交卷並記錄成績</button>
  </div>
</section>

<section class="card hidden" id="resultPanel">
  <h2>化學概念診斷報告</h2>
  <div class="notice warn" id="saveStatus"></div>
  <p id="studentLabel"></p>
  <div class="bigscore" id="totalScore"></div>
  <div class="metrics" id="metrics"></div>

  <h3>五大概念分析</h3>
  <div id="skillStats"></div>
  <div class="notice" id="advice"></div>

  <div class="actions">
    <button class="btn primary" id="retry">再確認／重送成績</button>
    <button class="btn" id="download">下載錯題CSV</button>
    <button class="btn" id="print">列印</button>
    <button class="btn" id="restart">重新作答</button>
  </div>

  <h3>逐題解析</h3>
  <div id="reviews"></div>
</section>

</div>
</div>

<div id="teacherApp" class="hidden">

<section class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h2>教師錯題分析後台</h2>
    <button class="btn" id="logout">登出</button>
  </div>
  <div class="notice" id="teacherStatus">正在讀取資料……</div>
</section>

<div id="teacherContent" class="hidden">

<section class="card">
  <div class="metrics" id="teacherMetrics"></div>
  <div class="filtergrid">
    <label>班級
      <select id="classFilter"><option value="">全部班級</option></select>
    </label>
    <label>姓名／座號
      <input type="text" id="studentSearch" placeholder="搜尋學生">
    </label>
    <label>題號
      <select id="questionFilter"><option value="">全部題目</option></select>
    </label>
    <label>得分狀態
      <select id="scoreFilter">
        <option value="">全部未全對</option>
        <option value="zero">零分／未答</option>
        <option value="partial">部分給分</option>
      </select>
    </label>
  </div>
  <div class="actions">
    <button class="btn" id="refresh">重新整理</button>
    <button class="btn" id="exportTeacher">匯出錯題CSV</button>
  </div>
</section>

<div class="teacherTabs">
  <button class="btn primary" id="tabQuestions">各題錯誤率</button>
  <button class="btn" id="tabStudents">學生成績</button>
  <button class="btn" id="tabWrong">學生錯題</button>
</div>

<section class="card" id="questionSection">
  <h2>各題未全對率</h2>
  <div class="tablewrap" id="questionTable"></div>
</section>

<section class="card hidden" id="studentSection">
  <h2>學生作答成績</h2>
  <div class="tablewrap" id="studentTable"></div>
</section>

<section class="card hidden" id="wrongSection">
  <h2>學生錯題明細</h2>
  <p id="wrongCount"></p>
  <div id="wrongList"></div>
</section>

</div>
</div>

</main>

<footer>
  化學鍵與物質結構｜學生診斷與教師分析系統
</footer>

<iframe name="uploadFrame" hidden title="成績上傳"></iframe>

<script>

// ==============================
// Apps Script 最新部署網址
// ==============================
const GAS_URL =

const QUIZ_VERSION='bond-quiz-15-2026-11-v1';

 options:[

},
{

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function newId(){
 if(crypto.randomUUID)return crypto.randomUUID();
 const b=new Uint8Array(16);
 crypto.getRandomValues(b);
 return 'q_'+[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function postForm(payload){
 const f=document.createElement('form');
 f.method='POST';
 f.action=GAS_URL;
 f.target='uploadFrame';
 f.hidden=true;
 const h=document.createElement('input');
 h.type='hidden';
 h.name='payload';
 h.value=JSON.stringify(payload);
 f.appendChild(h);
 document.body.appendChild(f);
 f.submit();
 f.remove();
}

function apiGet(action,params={}){
 return new Promise((resolve,reject)=>{
   const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   const url=new URL(GAS_URL);
   url.searchParams.set('action',action);
   url.searchParams.set('callback',cb);
   Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));

   const script=document.createElement('script');
   script.referrerPolicy='no-referrer';
   let ended=false;

   const clean=()=>{
     clearTimeout(timer);
     script.remove();
     delete window[cb];
   };

   window[cb]=data=>{
     if(ended)return;
     ended=true;clean();resolve(data);
   };

   script.onerror=()=>{
     if(ended)return;
     ended=true;clean();
     reject(new Error('Apps Script 連線失敗'));
   };

   const timer=setTimeout(()=>{
     if(ended)return;
     ended=true;clean();
     reject(new Error('連線逾時'));
   },18000);

   script.src=url.toString();
   document.head.appendChild(script);
 });
}

function csvDownload(rows,name){
 const csv='\ufeff'+rows.map(r=>r.map(v=>
   '"'+String(v??'').replace(/"/g,'""')+'"'
 ).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{
   type:'text/csv;charset=utf-8'
 }));
 const a=document.createElement('a');
 a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const state={
 index:0,answers:{},id:newId(),
 submitted:false,confirmed:false,
 snapshot:null,uploading:false
};

function who(){
 return {
  className:$('className').value.trim(),
  seat:$('seat').value.trim(),
  name:$('studentName').value.trim()
 };
}

function picked(q){
 return state.answers[String(q.id)]||[];
}

function saveLocal(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
   version:QUIZ_VERSION,
   ...state,
   identity:who()
  }));
 }catch(e){console.warn(e)}
}

function restoreLocal(){
 try{
  const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(!p||p.version!==QUIZ_VERSION)return;

  state.index=Math.max(0,Math.min(14,Number(p.index)||0));
  state.answers=p.answers||{};
  state.id=/^[A-Za-z0-9_-]{15,100}$/.test(p.id||'')?p.id:state.id;
  state.submitted=!!p.submitted;
  state.confirmed=!!p.confirmed;
  state.snapshot=p.snapshot||null;

  if(state.submitted&&!state.snapshot){
    state.submitted=false;
    state.confirmed=false;
  }

  $('className').value=p.identity?.className||'';
  $('seat').value=p.identity?.seat||'';
  $('studentName').value=p.identity?.name||'';
 }catch(e){console.warn(e)}
}

function renderNav(){
 let completed=0;
 $('numbergrid').replaceChildren();

 QUESTIONS.forEach((q,i)=>{
  const yes=picked(q).length>0;
  if(yes)completed++;

  const b=document.createElement('button');
  b.className='num'+(yes?' done':'')+(i===state.index?' active':'');
  b.textContent=q.id;
  b.disabled=state.submitted;
  b.onclick=()=>{
   state.index=i;
   saveLocal();
   renderQuestion();
  };
  $('numbergrid').appendChild(b);
 });

 $('progressText').textContent=completed+' / 15';
 $('progressFill').style.width=(completed/15*100)+'%';
}

function renderQuestion(){
 const q=QUESTIONS[state.index];
 $('quizPanel').classList.remove('hidden');
 $('resultPanel').classList.add('hidden');

 $('skill').textContent=q.skill;
 $('qtype').textContent=q.type==='single'?'單選':'多選';
 $('questionTitle').textContent='第 '+q.id+' 題｜'+q.title;
 $('questionStem').textContent=q.stem;

 $('options').replaceChildren();

 q.options.forEach((text,i)=>{
  const letter=LETTERS[i];
  const selected=picked(q).includes(letter);

  const label=document.createElement('label');
  label.className='option'+(selected?' checked':'');

  const input=document.createElement('input');
  input.type=q.type==='single'?'radio':'checkbox';
  input.name='q'+q.id;
  input.checked=selected;

  input.onchange=()=>{
   if(q.type==='single'){
    state.answers[String(q.id)]=[letter];
   }else{
    state.answers[String(q.id)]=input.checked
     ? [...new Set([...picked(q),letter])]
     : picked(q).filter(x=>x!==letter);
   }
   saveLocal();
   renderQuestion();
  };

  const span=document.createElement('span');
  span.textContent='('+letter+') '+text;

  label.append(input,span);
  $('options').appendChild(label);
 });

 $('prev').disabled=state.index===0;
 $('next').disabled=state.index===14;
 renderNav();
}

function scoreOne(q,ans){
 if(!ans.length)return 0;

 const n=LETTERS.filter(c=>
  ans.includes(c)!==q.answer.includes(c)
 ).length;

 if(n===0)return 2;
 if(q.type==='single')return 0;
 if(n===1)return 1.2;
 if(n===2)return 0.4;
 return 0;
}

function grade(){
 const details=QUESTIONS.map(q=>({
  q,selected:[...picked(q)].sort(),
  pts:scoreOne(q,picked(q))
 }));

 const skills={};
 let full=0,partial=0;

 details.forEach(d=>{
  if(d.pts===2)full++;
  else if(d.pts>0)partial++;

  if(!skills[d.q.skill]){
   skills[d.q.skill]={score:0,max:0};
  }
  skills[d.q.skill].score=+(
   skills[d.q.skill].score+d.pts
  ).toFixed(1);
  skills[d.q.skill].max+=2;
 });

 return {
  total:+details.reduce((s,d)=>s+d.pts,0).toFixed(1),
  full,partial,zero:15-full-partial,
  details,skills
 };
}

function snapshot(){
 const g=grade();
 return {
  submissionId:state.id,
  version:QUIZ_VERSION,
  ...who(),
  answers:Object.fromEntries(QUESTIONS.map(q=>[
   String(q.id),[...picked(q)].sort()
  ])),
  wrong:g.details.filter(d=>d.pts<2).map(d=>({
   id:d.q.id,
   title:d.q.title,
   skill:d.q.skill,
   stem:d.q.stem,
   options:d.q.options,
   selected:d.selected,
   explain:d.q.explain
  })),
  clientScore:g.total
 };
}

function renderResults(text,confirmed){
 const g=grade();
 $('quizPanel').classList.add('hidden');
 $('resultPanel').classList.remove('hidden');

 $('saveStatus').className='notice '+(confirmed?'':'warn');
 $('saveStatus').textContent=text;
 $('studentLabel').textContent=
  state.snapshot.className+' 班 '+
  state.snapshot.seat+' 號 '+state.snapshot.name;
 $('totalScore').textContent=g.total+' / 30 分';

 $('metrics').replaceChildren();
 [
  ['完全正確',g.full],
  ['部分給分',g.partial],
  ['零分／未答',g.zero]
 ].forEach(([label,value])=>{
  const d=document.createElement('div');
  d.className='metric';
  const b=document.createElement('strong');
  b.textContent=value;
  d.append(b,document.createTextNode(label));
  $('metrics').appendChild(d);
 });

 $('skillStats').replaceChildren();
 Object.entries(g.skills).forEach(([key,s])=>{
  const d=document.createElement('div');
  d.className='skill';
  const t=document.createElement('div');
  t.textContent=key+'：'+s.score+' / '+s.max;
  const bar=document.createElement('div');
  bar.className='track';
  const fill=document.createElement('div');
  fill.style.width=(s.score/s.max*100)+'%';
  bar.appendChild(fill);
  d.append(t,bar);
  $('skillStats').appendChild(d);
 });

 const weak=Object.entries(g.skills).filter(([,s])=>
  s.score/s.max<0.8
 ).sort((a,b)=>a[1].score/a[1].max-b[1].score/b[1].max);
 $('advice').textContent=weak.length
  ? '建議優先複習：'+weak.map(x=>x[0]).slice(0,3).join('、')
  : '五大概念得分率均達80%以上。';

 $('reviews').replaceChildren();
 g.details.forEach(d=>{
  const box=document.createElement('article');
  box.className='review';
  const h=document.createElement('h3');
  h.textContent='第 '+d.q.id+' 題｜'+d.q.title;
  const p=document.createElement('p');
  p.className=d.pts===2?'correct':'wrong';
  p.textContent='得分：'+d.pts+'/2；作答：'+
   (d.selected.join('、')||'未作答')+
   '；正解：'+d.q.answer.split('').join('、');

  const ex=document.createElement('div');
  ex.className='explain';
  ex.textContent='解析：'+d.q.explain;

  const det=document.createElement('details');
  const sum=document.createElement('summary');
  sum.textContent='查看完整題目及選項';
  det.appendChild(sum);

  const stem=document.createElement('p');
  stem.textContent=d.q.stem;
  det.appendChild(stem);
  d.q.options.forEach((op,i)=>{
   const x=document.createElement('p');
   x.textContent='('+LETTERS[i]+') '+op;
   if(d.q.answer.includes(LETTERS[i]))x.className='correct';
   det.appendChild(x);
  });

  box.append(h,p,ex,det);
  $('reviews').appendChild(box);
 });

 $('retry').classList.toggle('hidden',confirmed);
}

async function verifySave(){
 for(let i=0;i<8;i++){
  await sleep(i===0?1400:1600);
  try{
   const r=await apiGet('status',{id:state.id});
   if(r.ok&&r.recorded)return true;
  }catch(e){console.warn(e)}
 }
 return false;
}

async function upload(){
 if(state.uploading||state.confirmed||!state.snapshot)return;

 state.uploading=true;
 $('retry').disabled=true;
 renderResults('正在上傳並確認成績……',false);

 try{
  postForm(state.snapshot);
  const ok=await verifySave();

  if(ok){
   state.confirmed=true;
   saveLocal();
   renderResults('成績已確認寫入Google試算表。',true);
  }else{
   renderResults(
    '已完成計分，但尚未確認資料成功寫入。請重送或通知老師。',
    false
   );
  }
 }catch(e){
  renderResults('上傳失敗：'+e.message,false);
 }finally{
  state.uploading=false;
  $('retry').disabled=false;
 }
}

function submitQuiz(){
 if(state.submitted)return;
 const p=who();

 if(!p.className||!p.seat||!p.name){
  $('studentNotice').textContent='請先填寫班級、座號及姓名。';
  $('studentNotice').className='notice error';
  return;
 }

 const missing=QUESTIONS.filter(q=>!picked(q).length).map(q=>q.id);
 const prompt=missing.length
  ? '第 '+missing.join('、')+' 題未作答，將以0分計，確定交卷？'
  : '確定交卷並上傳成績？';

 if(!confirm(prompt))return;

 state.submitted=true;
 state.snapshot=snapshot();
 state.confirmed=false;
 ['className','seat','studentName'].forEach(x=>$(x).disabled=true);
 saveLocal();
 upload();
}

function restart(){
 if(!confirm('確定重新作答並建立新紀錄？'))return;
 state.index=0;
 state.answers={};
 state.id=newId();
 state.submitted=false;
 state.confirmed=false;
 state.snapshot=null;
 ['className','seat','studentName'].forEach(x=>$(x).disabled=false);
 saveLocal();
 renderQuestion();
}

async function loginTeacher(){
 const password=$('teacherPassword').value;
 if(!password){
  $('loginMsg').textContent='請輸入教師密碼。';
  $('loginMsg').classList.remove('hidden');
  return;
 }
 $('teacherPassword').value='';
 $('loginBtn').disabled=true;
 $('loginMsg').classList.remove('hidden');
 $('loginMsg').textContent='正在驗證教師密碼……';

 const loginId=newId();

 try{
  postForm({action:'teacherLogin',loginId,password});
  let result=null;

  for(let i=0;i<12;i++){
   await sleep(i===0?1200:1300);
   try{
    const r=await apiGet('loginStatus',{id:loginId});
    if(r.found||r.ok===false){
     result=r;break;
    }
   }catch(e){
    if(i===11)throw e;
   }
  }

  if(!result)throw new Error('尚未收到登入結果。');
  if(!result.ok||!result.authenticated||!result.token){
   throw new Error(result.error||'教師密碼錯誤');
  }

  teacherToken=result.token;
  showMode('teacher');
  await refreshTeacher();

 }catch(e){
  $('loginMsg').textContent='登入失敗：'+e.message;
  $('loginMsg').classList.remove('hidden');
 }finally{
  $('loginBtn').disabled=false;
 }
}

function logoutTeacher(){
 const token=teacherToken;
 teacherToken='';
 teacherData=null;
 $('teacherContent').classList.add('hidden');
 $('teacherMetrics').replaceChildren();
 $('questionTable').replaceChildren();
 $('studentTable').replaceChildren();
 $('wrongList').replaceChildren();

 if(token)postForm({action:'teacherLogout',token});
 showMode('roles');
}

function escapeHTML(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 }[c]));
}

async function refreshTeacher(){
 if(!teacherToken){
  showLogin('教師憑證已失效，請重新登入。');
  return;
 }

 $('teacherStatus').textContent='正在讀取試算表……';
 $('teacherStatus').classList.remove('hidden');

 try{
  const r=await apiGet('teacherData',{token:teacherToken});
  if(!r.ok)throw new Error(r.error||'讀取失敗');

  teacherData=r.report;
  fillFilters();
  renderTeacher();

  $('teacherStatus').classList.add('hidden');
  $('teacherContent').classList.remove('hidden');

 }catch(e){
  $('teacherStatus').textContent='讀取失敗：'+e.message;
  if(/憑證|登入|過期|授權/.test(e.message)){
   teacherToken='';
   teacherData=null;
   showLogin('請重新登入教師後台。');
  }
 }
}

function matchWrong(w,f){
 return (!f.cls||w.className===f.cls)
  &&(!f.search||[w.name,w.seat].some(x=>
    String(x).toLowerCase().includes(f.search)))
  &&(!f.qid||String(w.questionId)===f.qid)
  &&(!f.score||(f.score==='zero'
   ? w.points===0
   : w.points>0&&w.points<2));
}

function renderTeacher(){
 if(!teacherData)return;

 const o=teacherData.overview;
 $('teacherMetrics').replaceChildren();
 [
  ['交卷人次',o.attempts],
  ['不同學生',o.uniqueStudents],
  ['平均分數',o.average],
  ['未全對題次',o.wrongCount]
 ].forEach(([label,val])=>{
  const d=document.createElement('div');
  d.className='metric';
  const b=document.createElement('strong');
  b.textContent=val;
  d.append(b,document.createTextNode(label));
  $('teacherMetrics').appendChild(d);
 });

 renderQuestions();
 renderStudents();
 renderWrong();
}

function renderQuestions(){
 const f=teacherFilters();
 const questions=teacherData.questions.filter(q=>
  !f.qid||String(q.id)===f.qid
 );

 let html='<table><thead><tr>'+
 '<th>題號</th><th>題目</th><th>概念</th>'+
 '<th>交卷</th><th>未全對</th><th>部分得分</th>'+
 '<th>錯誤率</th><th>查看</th></tr></thead><tbody>';

 questions.forEach(q=>{
  html+='<tr><td>'+q.id+'</td>'+
  '<td>'+escapeHTML(q.title)+'</td>'+
  '<td>'+escapeHTML(q.skill)+'</td>'+
  '<td>'+q.attempts+'</td>'+
  '<td>'+q.wrong+'</td>'+
  '<td>'+q.partial+'</td>'+
  '<td>'+Math.round(q.wrongRate*100)+'%</td>'+
  '<td><button class="btn" data-q="'+q.id+'">錯題</button></td></tr>';
 });
 html+='</tbody></table>';
 $('questionTable').innerHTML=html;

 $('questionTable').querySelectorAll('[data-q]').forEach(b=>{
  b.onclick=()=>{
   $('questionFilter').value=b.dataset.q;
   openTab('wrong');
  };
 });
}

function renderStudents(){
 const f=teacherFilters();
 const data=teacherData.attempts.filter(s=>
  (!f.cls||s.className===f.cls)
  &&(!f.search||[s.name,s.seat].some(x=>
   String(x).toLowerCase().includes(f.search)))
  &&(!f.qid||String(s.wrongIds).split(',').includes(f.qid))
 );

 let html='<table><thead><tr>'+
 '<th>時間</th><th>班級</th><th>座號</th>'+
 '<th>姓名</th><th>總分</th><th>全對題數</th>'+
 '<th>部分給分</th><th>錯題號</th></tr></thead><tbody>';

 data.forEach(s=>{
  html+='<tr>'+
  '<td>'+escapeHTML(s.time)+'</td>'+
  '<td>'+escapeHTML(s.className)+'</td>'+
  '<td>'+escapeHTML(s.seat)+'</td>'+
  '<td>'+escapeHTML(s.name)+'</td>'+
  '<td>'+s.score+'/30</td>'+
  '<td>'+s.full+'</td>'+
  '<td>'+s.partial+'</td>'+
  '<td>'+escapeHTML(s.wrongIds||'無')+'</td></tr>';
 });
 html+='</tbody></table>';
 $('studentTable').innerHTML=html;
}

function renderWrong(){
 const f=teacherFilters();
 const records=teacherData.wrong.filter(w=>matchWrong(w,f));
 $('wrongCount').textContent='符合條件的錯題：'+records.length+' 筆';
 $('wrongList').replaceChildren();

 records.forEach(w=>{
  const d=document.createElement('details');
  d.className='detail';

  const summary=document.createElement('summary');
  summary.textContent=
   w.className+'班 '+w.seat+'號 '+w.name+
   '｜第'+w.questionId+'題 '+w.title+
   '｜'+w.points+'/2分';
  d.appendChild(summary);

  const info=document.createElement('p');
  info.textContent='作答：'+(w.selected||'未答')+
   '；正解：'+w.correct+'；'+w.kind;
  d.appendChild(info);

  const stem=document.createElement('p');
  stem.textContent=w.stem;
  d.appendChild(stem);

  (w.options||[]).forEach((x,i)=>{
   const p=document.createElement('p');
   p.textContent='('+LETTERS[i]+') '+x;
   if(w.correct.includes(LETTERS[i]))p.className='correct';
   d.appendChild(p);
  });

  const exp=document.createElement('p');
  exp.textContent='解析：'+w.explain;
  d.appendChild(exp);
  $('wrongList').appendChild(d);
 });
}

function openTab(name){
 $('questionSection').classList.toggle('hidden',name!=='question');
 $('studentSection').classList.toggle('hidden',name!=='student');
 $('wrongSection').classList.toggle('hidden',name!=='wrong');

 $('tabQuestions').classList.toggle('primary',name==='question');
 $('tabStudents').classList.toggle('primary',name==='student');
 $('tabWrong').classList.toggle('primary',name==='wrong');

 renderTeacher();
}

function exportTeacher(){
 const rows=[[
  '班級','座號','姓名','題號','題目',
  '概念','學生答案','正解','得分','錯誤類型'
 ]];

 teacherData.wrong.filter(w=>matchWrong(w,teacherFilters()))
  .forEach(w=>rows.push([
   w.className,w.seat,w.name,w.questionId,w.title,
   w.skill,w.selected,w.correct,w.points,w.kind
  ]));

 csvDownload(rows,'教師錯題分析.csv');
}

// ==============================
// 綁定按鈕與啟動
// ==============================
$('studentRole').onclick=()=>{
 if(!studentReady){
  restoreLocal();
  studentReady=true;
  if(state.submitted){
   ['className','seat','studentName'].forEach(x=>$(x).disabled=true);
   renderNav();
   renderResults(
    state.confirmed?'這份答卷已確認儲存。':'這份答卷尚未確認上傳。',
    state.confirmed
   );
  }else{
   renderQuestion();
  }
 }
 showMode('student');
};

$('teacherRole').onclick=()=>showLogin();

$('back').onclick=()=>{
 if(teacherToken){
  logoutTeacher();
 }else{
  showMode('roles');
 }
};

$('loginBtn').onclick=loginTeacher;
$('teacherPassword').addEventListener('keydown',e=>{
 if(e.key==='Enter')loginTeacher();
});

$('logout').onclick=logoutTeacher;
$('refresh').onclick=refreshTeacher;
$('exportTeacher').onclick=exportTeacher;

$('tabQuestions').onclick=()=>openTab('question');
$('tabStudents').onclick=()=>openTab('student');
$('tabWrong').onclick=()=>openTab('wrong');

['classFilter','questionFilter','scoreFilter'].forEach(x=>
 $(x).onchange=renderTeacher
);
$('studentSearch').oninput=renderTeacher;

showMode('roles');

</script>
</body>
</html>
